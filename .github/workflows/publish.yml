name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for this immutable tagged release
        required: true
        default: next
        type: string

permissions:
  contents: read
  id-token: write

env:
  NPM_DIST_TAG: ${{ inputs.npm_tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate immutable release ref
        env:
          NPM_DIST_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          [[ "$NPM_DIST_TAG" =~ ^[a-z0-9][a-z0-9-]*$ ]]
      - run: npm ci
      - run: npm test
      - name: Pack release artifact once
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > pack.json
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const packed = JSON.parse(fs.readFileSync("pack.json", "utf8"))[0];
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=${path.basename(packed.filename)}\n`);
          NODE
      - name: Revalidate packed release identity
        env:
          RELEASE_TARBALL: ${{ env.RELEASE_TARBALL }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const ref = execFileSync("git", ["rev-parse", `${process.env.GITHUB_REF}^{commit}`], { encoding: "utf8" }).trim();
          if (head !== process.env.GITHUB_SHA || ref !== process.env.GITHUB_SHA) throw new Error("selected release ref changed during build");
          const source = JSON.parse(execFileSync("git", ["show", `${process.env.GITHUB_SHA}:package.json`], { encoding: "utf8" }));
          const packed = JSON.parse(execFileSync("tar", ["-xOf", process.env.RELEASE_TARBALL, "package/package.json"], { encoding: "utf8" }));
          if (process.env.GITHUB_REF_NAME !== `v${source.version}`) throw new Error("tag does not match selected source version");
          if (packed.name !== source.name || packed.version !== source.version) throw new Error("packed identity differs from selected source");
          NODE
      - name: Verify packed artifact
        run: npm run verify:package
        env:
          RELEASE_TARBALL: ${{ env.RELEASE_TARBALL }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan packed artifact
        env:
          RELEASE_TARBALL: ${{ env.RELEASE_TARBALL }}
        run: |
          gitleaks version
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          tar -xzf "$RELEASE_TARBALL" -C "$scan_dir"
          gitleaks dir --redact --no-banner --exit-code 2 "$scan_dir/package"
      - name: Publish exact packed artifact
        run: npm publish "$RELEASE_TARBALL" --provenance --access public --tag "$NPM_DIST_TAG"
